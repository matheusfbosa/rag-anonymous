[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anonymous"
version = "0.1.0"
description = "RAG pipeline with Offline/On-Demand anonymization."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
    "langchain-ollama==1.0.1",
    "langchain-elasticsearch==1.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.1.1,<2",
    "presidio-analyzer==2.2.361",
    "presidio-anonymizer==2.2.361",
    "click>=8.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "rag-anonymous[test]",
    "pre-commit>=4.0",
    "ruff>=0.12",
]

[project.scripts]
rag-anon = "rag_anonymous.cli:main"

[tool.setuptools.packages.find]
include = ["rag_anonymous*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["rag_anonymous"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["rag_anonymous"]
