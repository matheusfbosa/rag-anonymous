[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anonymous"
version = "0.1.0"
description = "RAG pipeline with Offline/On-Demand anonymization."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
    "langchain-ollama==1.0.1",
    "langchain-elasticsearch==1.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.1.1,<2",
    "presidio-analyzer==2.2.361",
    "presidio-anonymizer==2.2.361",
    "click>=8.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "rag-anonymous[test]",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.12",
]

[project.scripts]
rag-anon = "rag_anonymous.cli:main"

[tool.setuptools.packages.find]
include = ["rag_anonymous*"]

[tool.setuptools.package-data]
rag_anonymous = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["rag_anonymous"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ANN",
]
ignore = [
    "E501",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["rag_anonymous"]

[tool.mypy]
python_version = "3.12"
packages = ["rag_anonymous"]
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "elasticsearch.*",
    "langchain_elasticsearch.*",
    "langchain_ollama.*",
    "langchain_text_splitters.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true
